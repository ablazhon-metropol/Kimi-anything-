<!DOCTYPE html><html lang=ru><head><meta charset=UTF-8><meta name=viewport content=width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no><title>Health Assistant</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}body{background:#0f0f0f;color:#f0f0f0;min-height:100vh}.app{max-width:480px;margin:0 auto;padding:16px;padding-bottom:90px}.header{text-align:center;padding:16px 0}.header h1{font-size:22px;font-weight:600}.header p{color:#888;font-size:13px;margin-top:2px}.card{background:#1a1a1a;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #333}.card-title{font-size:15px;font-weight:600;margin-bottom:10px;color:#4ade80}.stat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.stat-label{color:#aaa;font-size:13px}.stat-value{font-size:22px;font-weight:700}.stat-value.water{color:#60a5fa}.stat-value.sleep{color:#fbbf24}.stat-value.steps{color:#4ade80}.stat-value.cals{color:#f87171}.progress{height:6px;background:#333;border-radius:3px;overflow:hidden;margin-top:6px}.progress-bar{height:100%;border-radius:3px;transition:width .3s}.progress-bar.water{background:#60a5fa}.progress-bar.sleep{background:#fbbf24}.progress-bar.steps{background:#4ade80}.progress-bar.cals{background:#f87171}.btn{display:inline-block;padding:8px 14px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;margin-top:6px;margin-right:6px}.btn-green{background:#4ade80;color:#000}.btn-blue{background:#60a5fa;color:#000}.btn-yellow{background:#fbbf24;color:#000}.btn-red{background:#f87171;color:#fff}.btn-gray{background:#333;color:#f0f0f0}.input{width:100%;padding:8px 12px;background:#222;border:1px solid #444;border-radius:8px;color:#f0f0f0;font-size:14px;margin-bottom:6px}.input:focus{outline:none;border-color:#4ade80}.label{display:block;color:#aaa;font-size:12px;margin-bottom:4px;margin-top:10px}.section-title{font-size:16px;font-weight:600;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid #333}.nav{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-top:1px solid #333;display:flex;justify-content:space-around;padding:6px 0;z-index:100}.nav-btn{background:none;border:none;color:#888;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 6px}.nav-btn.active{color:#4ade80}.nav-icon{font-size:18px}.hidden{display:none}.list-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #333;font-size:13px}.list-item:last-child{border-bottom:none}.empty{text-align:center;color:#666;padding:16px;font-size:13px}.quick-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{display:inline-block;padding:5px 10px;background:#222;border:1px solid #444;border-radius:16px;font-size:12px;color:#aaa;cursor:pointer;margin:3px 3px 0 0}.chip.active{background:#4ade80;color:#000;border-color:#4ade80}.reminder-item{display:flex;align-items:center;gap:10px;padding:8px;background:#222;border-radius:8px;margin-bottom:6px}.reminder-time{min-width:45px;font-weight:600;color:#4ade80;font-size:12px}.reminder-text{flex:1;font-size:13px}.quote{background:#222;border-left:3px solid #4ade80;padding:10px;margin-bottom:12px;font-style:italic;color:#aaa;font-size:13px}.quote-author{color:#666;font-size:11px;margin-top:3px;font-style:normal}</style></head><body><div class=app><div class=header><h1>Health Assistant</h1><p>Андрей, 48 | Минск</p></div><div class=quote id=quote><div>Здоровье — это не всё, но без здоровья всё — ничто.</div><div class=quote-author>— Артур Шопенгауэр</div></div><div id=content></div></div><div class=nav><button class='nav-btn active' onclick=showPage('dashboard')><span class=nav-icon>📊</span><span>Главная</span></button><button class=nav-btn onclick=showPage('water')><span class=nav-icon>💧</span><span>Вода</span></button><button class=nav-btn onclick=showPage('sleep')><span class=nav-icon>🌙</span><span>Сон</span></button><button class=nav-btn onclick=showPage('steps')><span class=nav-icon>👟</span><span>Шаги</span></button><button class=nav-btn onclick=showPage('meals')><span class=nav-icon>🍽️</span><span>Еда</span></button><button class=nav-btn onclick=showPage('workouts')><span class=nav-icon>💪</span><span>Спорт</span></button><button class=nav-btn onclick=showPage('reminders')><span class=nav-icon>⏰</span><span>Напом.</span></button></div><script>(function(){const LS={get:k=>{try{const v=localStorage.getItem('ha_'+k);return v?JSON.parse(v):null}catch(e){return null}},set:(k,v)=>localStorage.setItem('ha_'+k,JSON.stringify(v))};const today=()=>new Date().toISOString().split('T')[0];const quotes=[['Здоровье — это не всё, но без здоровья всё — ничто.','Артур Шопенгауэр'],['Движение — это жизнь.','Гиппократ'],['Тот, кто не находит время для здоровья, потом найдёт время для болезни.','Эрл Найтингейл'],['Победа над собой — самая великая победа.','Платон']];let data=LS.get('data')||{water:{},sleep:{},steps:{},meals:{},workouts:{},reminders:[],goals:{water:2500,sleep:7.5,steps:10000,cals:2200,protein:120}};let page='dashboard';let wType='cardio';function init(){const q=quotes[Math.floor(Math.random()*quotes.length)];document.getElementById('quote').innerHTML='<div>'+q[0]+'</div><div class=quote-author>— '+q[1]+'</div>';render();setInterval(checkReminders,30000)}function save(){LS.set('data',data)}function showPage(p){page=p;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));const btn=event.target.closest('.nav-btn');if(btn)btn.classList.add('active');render()}function getToday(k){return data[k][today()]||0}function pct(v,g){return g?Math.min(100,Math.round((v/g)*100)):0}function render(){const c=document.getElementById('content');if(page==='dashboard')renderDashboard(c);else if(page==='water')renderWater(c);else if(page==='sleep')renderSleep(c);else if(page==='steps')renderSteps(c);else if(page==='meals')renderMeals(c);else if(page==='workouts')renderWorkouts(c);else if(page==='reminders')renderReminders(c)}function renderDashboard(c){const w=getToday('water'),s=data.sleep[today()]||0,st=getToday('steps');let cal=0;const meals=data.meals[today()]||[];for(let i=0;i<meals.length;i++)cal+=meals[i].cals||0;const rem=data.reminders.filter(r=>!r.done).length;let h='<div class=card><div class=card-title>📊 Сегодня</div>';h+='<div class=stat-row><span class=stat-label>Вода</span><span class=stat-value water>'+w+' <small style=font-size:12px;color:#888>/ '+data.goals.water+'</small></span></div>';h+='<div class=progress><div class=progress-bar water style=width:'+pct(w,data.goals.water)+'%></div></div>';h+='<div class=stat-row style=margin-top:10px><span class=stat-label>Сон</span><span class=stat-value sleep>'+s+' <small style=font-size:12px;color:#888>/ '+data.goals.sleep+' ч</small></span></div>';h+='<div class=progress><div class=progress-bar sleep style=width:'+pct(s,data.goals.sleep)+'%></div></div>';h+='<div class=stat-row style=margin-top:10px><span class=stat-label>Шаги</span><span class=stat-value steps>'+st+' <small style=font-size:12px;color:#888>/ '+data.goals.steps+'</small></span></div>';h+='<div class=progress><div class=progress-bar steps style=width:'+pct(st,data.goals.steps)+'%></div></div>';h+='<div class=stat-row style=margin-top:10px><span class=stat-label>Ккал</span><span class=stat-value cals>'+cal+' <small style=font-size:12px;color:#888>/ '+data.goals.cals+'</small></span></div>';h+='<div class=progress><div class=progress-bar cals style=width:'+pct(cal,data.goals.cals)+'%></div></div>';h+='</div>';h+='<div class=card><div class=card-title>⏰ Напоминания: '+rem+'</div>';if(rem){const active=data.reminders.filter(r=>!r.done).slice(0,3);for(let i=0;i<active.length;i++){h+='<div class=list-item><span>'+active[i].time+'</span><span>'+active[i].text+'</span></div>'}}else{h+='<div class=empty>Нет напоминаний</div>'}h+='</div>';c.innerHTML=h}function renderWater(c){const w=getToday('water');let h='<div class=card><div class=card-title>💧 Вода</div>';h+='<div class=stat-row><span class=stat-label>Выпито</span><span class=stat-value water>'+w+' мл</span></div>';h+='<div class=progress><div class=progress-bar water style=width:'+pct(w,data.goals.water)+'%></div></div>';h+='<div class=quick-btns><button class=btn btn-blue onclick=addWater(250)>+250 мл</button><button class=btn btn-blue onclick=addWater(500)>+500 мл</button><button class=btn btn-blue onclick=addWater(750)>+750 мл</button></div>';h+='</div>';h+='<div class=card><div class=card-title>История сегодня</div>';const log=data.water[today()+'_log']||[];if(log.length){for(let i=0;i<log.length;i++){h+='<div class=list-item><span>+ '+log[i]+' мл</span><button class=btn btn-gray style=padding:4px 8px;margin:0 onclick=removeWater('+i+')>Удалить</button></div>'}}else{h+='<div class=empty>Нет записей</div>'}h+='</div>';c.innerHTML=h}function addWater(ml){data.water[today()]=(data.water[today()]||0)+ml;data.water[today()+'_log']=data.water[today()+'_log']||[];data.water[today()+'_log'].push(ml);save();render()}function removeWater(i){const log=data.water[today()+'_log']||[];if(log[i]){data.water[today()]-=log[i];data.water[today()+'_log'].splice(i,1);if(data.water[today()]<0)data.water[today()]=0;save();render()}}function renderSleep(c){const s=data.sleep[today()]||0;let h='<div class=card><div class=card-title>🌙 Сон</div>';h+='<div class=stat-row><span class=stat-label>Сегодня</span><span class=stat-value sleep>'+s+' ч</span></div>';h+='<div class=progress><div class=progress-bar sleep style=width:'+pct(s,data.goals.sleep)+'%></div></div>';h+='<div class=label>Время отбоя</div><input type=time class=input id=sleep-start>';h+='<div class=label>Время подъёма</div><input type=time class=input id=sleep-end>';h+='<div class=label>Качество</div><select class=input id=sleep-q><option value=0>Оцените</option><option value=5>Плохой</option><option value=7>Нормальный</option><option value=9>Отличный</option><option value=10>Идеальный</option></select>';h+='<button class=btn btn-yellow onclick=saveSleep()>Сохранить</button></div>';h+='<div class=card><div class=card-title>История</div>';const keys=Object.keys(data.sleep||{}).filter(k=>!k.includes('_log')).sort().slice(-7);if(keys.length){for(let i=0;i<keys.length;i++){const d=new Date(keys[i]);const day=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()];h+='<div class=list-item><span>'+day+' '+d.getDate()+'</span><span>'+data.sleep[keys[i]]+' ч</span></div>'}}else{h+='<div class=empty>Нет записей</div>'}h+='</div>';c.innerHTML=h}function saveSleep(){const st=document.getElementById('sleep-start').value;const en=document.getElementById('sleep-end').value;if(!st||!en){alert('Укажите время');return}const sh=parseInt(st.slice(0,2)),sm=parseInt(st.slice(3,5));const eh=parseInt(en.slice(0,2)),em=parseInt(en.slice(3,5));let dur=(eh*60+em)-(sh*60+sm);if(dur<0)dur+=24*60;const hours=(dur/60).toFixed(1);data.sleep[today()]=parseFloat(hours);save();render()}function renderSteps(c){const s=getToday('steps');let h='<div class=card><div class=card-title>👟 Шаги</div>';h+='<div class=stat-row><span class=stat-label>Сегодня</span><span class=stat-value steps>'+s+'</span></div>';h+='<div class=progress><div class=progress-bar steps style=width:'+pct(s,data.goals.steps)+'%></div></div>';h+='<div style=color:#888;font-size:12px;margin-top:4px>≈ '+(s*0.0007).toFixed(2)+' км | ≈ '+Math.round(s*0.04)+' ккал</div>';h+='<div class=label>Добавить шаги</div><input type=number class=input id=steps-input placeholder=Количество>';h+='<button class=btn btn-green onclick=addSteps()>Добавить</button></div>';c.innerHTML=h}function addSteps(){const v=parseInt(document.getElementById('steps-input').value)||0;if(v<=0)return;data.steps[today()]=(data.steps[today()]||0)+v;save();render()}function renderMeals(c){const meals=data.meals[today()]||[];let tc=0,tp=0;for(let i=0;i<meals.length;i++){tc+=meals[i].cals||0;tp+=meals[i].protein||0}let h='<div class=card><div class=card-title>🍽️ Питание</div>';h+='<div class=stat-row><span class=stat-label>Ккал</span><span class=stat-value cals>'+tc+' / '+data.goals.cals+'</span></div>';h+='<div class=progress><div class=progress-bar cals style=width:'+pct(tc,data.goals.cals)+'%></div></div>';h+='<div class=stat-row style=margin-top:6px><span class=stat-label>Белки</span><span class=stat-value>'+tp+' / '+data.goals.protein+' г</span></div></div>';h+='<div class=card><div class=card-title>Добавить приём пищи</div>';h+='<select class=input id=meal-type><option value=breakfast>Завтрак</option><option value=lunch>Обед</option><option value=dinner>Ужин</option><option value=snack>Перекус</option></select>';h+='<input type=number class=input id=meal-cals placeholder=Калории>';h+='<input type=number class=input id=meal-protein placeholder=Белки,г>';h+='<input type=text class=input id=meal-desc placeholder=Что ели?>';h+='<button class=btn btn-green onclick=addMeal()>Добавить</button></div>';h+='<div class=card><div class=card-title>Сегодня</div>';if(meals.length){for(let i=0;i<meals.length;i++){const m=meals[i];const icon=m.type==='breakfast'?'🌅':m.type==='lunch'?'🍲':m.type==='dinner'?'🌙':'🍎';h+='<div class=list-item><span>'+icon+' '+(m.desc||m.type)+'</span><span>'+m.cals+' ккал</span></div>'}}else{h+='<div class=empty>Нет записей</div>'}h+='</div>';c.innerHTML=h}function addMeal(){const type=document.getElementById('meal-type').value;const cals=parseInt(document.getElementById('meal-cals').value)||0;const protein=parseInt(document.getElementById('meal-protein').value)||0;const desc=document.getElementById('meal-desc').value.trim();if(cals<=0){alert('Укажите калории');return}data.meals[today()]=data.meals[today()]||[];data.meals[today()].push({type,cals,protein:protein||0,desc,time:new Date().toISOString()});save();render()}function renderWorkouts(c){const list=data.workouts[today()]||[];let h='<div class=card><div class=card-title>💪 Тренировка</div>';h+='<div class=quick-btns><span class=chip id=w0 onclick=selWorkout(0)>Кардио</span><span class=chip id=w1 onclick=selWorkout(1)>Силовая</span><span class=chip id=w2 onclick=selWorkout(2)>Растяжка</span><span class=chip id=w3 onclick=selWorkout(3)>Кайт</span><span class=chip id=w4 onclick=selWorkout(4)>Ходьба</span></div>';h+='<div class=label>Минут</div><input type=number class=input id=w-dur placeholder=30>';h+='<div class=label>Интенсивность</div><select class=input id=w-int><option value=low>Низкая</option><option value=medium selected>Средняя</option><option value=high>Высокая</option></select>';h+='<button class=btn btn-green onclick=addWorkout()>Записать</button></div>';h+='<div class=card><div class=card-title>Сегодня</div>';if(list.length){for(let i=0;i<list.length;i++){const w=list[i];const icon=w.type==='cardio'?'🏃':w.type==='strength'?'💪':w.type==='stretch'?'🧘':w.type==='kite'?'🪁':'🚶';h+='<div class=list-item><span>'+icon+' '+w.type+' ('+w.duration+' мин)</span><span>'+w.intensity+'</span></div>'}}else{h+='<div class=empty>Нет тренировок</div>'}h+='</div>';c.innerHTML=h;selWorkout(0)}function selWorkout(i){const types=['cardio','strength','stretch','kite','walk'];wType=types[i];for(let j=0;j<5;j++){document.getElementById('w'+j).classList.toggle('active',j===i)}}function addWorkout(){const dur=parseInt(document.getElementById('w-dur').value)||0;if(dur<=0){alert('Укажите длительность');return}data.workouts[today()]=data.workouts[today()]||[];data.workouts[today()].push({type:wType,duration:dur,intensity:document.getElementById('w-int').value,time:new Date().toISOString()});save();render()}function renderReminders(c){let h='<div class=card><div class=card-title>⏰ Напоминания</div>';h+='<div class=label>Время</div><input type=time class=input id=r-time>';h+='<div class=label>Текст</div><input type=text class=input id=r-text placeholder=Например: выпить воды>';h+='<div class=label>Повтор</div><select class=input id=r-rep><option value=once>Один раз</option><option value=daily>Ежедневно</option></select>';h+='<button class=btn btn-green onclick=addReminder()>Добавить</button></div>';h+='<div class=card><div class=card-title>Активные</div>';const active=data.reminders.filter(r=>!r.done);if(active.length){for(let i=0;i<active.length;i++){const r=active[i];h+='<div class=reminder-item><span class=reminder-time>'+r.time+'</span><span class=reminder-text>'+r.text+(r.repeat==='daily'?' (ежедневно)':'')+'</span><button class=btn btn-gray style=padding:4px 8px;margin:0 onclick=toggleReminder('+i+')>✓</button><button class=btn btn-red style=padding:4px 8px;margin:0 onclick=delReminder('+i+')>×</button></div>'}}else{h+='<div class=empty>Нет напоминаний</div>'}h+='</div>';c.innerHTML=h}function addReminder(){const t=document.getElementById('r-time').value;const txt=document.getElementById('r-text').value.trim();const rep=document.getElementById('r-rep').value;if(!t||!txt){alert('Заполните поля');return}data.reminders.push({time:t,text:txt,repeat:rep,done:false,id:Date.now()});save();render()}function toggleReminder(idx){const active=data.reminders.filter(r=>!r.done);if(active[idx]){const target=active[idx];for(let i=0;i<data.reminders.length;i++){if(data.reminders[i].id===target.id){data.reminders[i].done=true;break}}save();render()}}function delReminder(idx){const active=data.reminders.filter(r=>!r.done);if(active[idx]){const target=active[idx];for(let i=0;i<data.reminders.length;i++){if(data.reminders[i].id===target.id){data.reminders.splice(i,1);break}}save();render()}}function checkReminders(){const now=new Date();const h=String(now.getHours()).padStart(2,'0');const m=String(now.getMinutes()).padStart(2,'0');const cur=h+':'+m;for(let i=0;i<data.reminders.length;i++){const r=data.reminders[i];if(!r.done&&r.time===cur){if('Notification'in window&&Notification.permission==='granted'){new Notification('Health Assistant',{body:r.text})}}}}window.showPage=showPage;window.addWater=addWater;window.removeWater=removeWater;window.saveSleep=saveSleep;window.addSteps=addSteps;window.addMeal=addMeal;window.selWorkout=selWorkout;window.addWorkout=addWorkout;window.addReminder=addReminder;window.toggleReminder=toggleReminder;window.delReminder=delReminder;if('Notification'in window)Notification.requestPermission();init()})();</script></body></html>
