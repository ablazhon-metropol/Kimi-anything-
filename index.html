mportant}.section{display:none}.section.active{display:block}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}.modal.show{opacity:1;pointer-events:auto}.modal-content{background:var(--card);border-radius:var(--radius);padding:24px;width:90%;max-width:420px;border:1px solid var(--border)}.modal-title{font-size:18px;font-weight:600;margin-bottom:16px}.modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}.empty-state-icon{font-size:48px;margin-bottom:12px;opacity:.5}.toggle{display:flex;align-items:center;gap:12px;cursor:pointer}.toggle-switch{width:44px;height:24px;background:var(--card2);border-radius:12px;position:relative;transition:background .2s;border:1px solid var(--border)}.toggle-switch.on{background:var(--accent);border-color:var(--accent)}.toggle-switch::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:1px;left:1px;transition:transform .2s}.toggle-switch.on::after{transform:translateX(20px)}.quick-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.quick-btn{padding:8px 14px;background:var(--card2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;font-size:13px;transition:all .2s}.quick-btn:hover{border-color:var(--accent);color:var(--accent)}.quote{background:var(--card2);border-radius:var(--radius-sm);padding:16px;border-left:3px solid var(--accent);margin-bottom:16px;font-style:italic;color:var(--text2);font-size:14px}.quote-author{color:var(--text3);font-size:12px;margin-top:8px;font-style:normal}@media(max-width:768px){.sidebar{width:100%;position:fixed;bottom:0;top:auto;height:auto;border-right:none;border-top:1px solid var(--border);padding:8px;flex-direction:row;justify-content:space-around;z-index:100}.logo,.user{display:none}.nav{f 'progress-fill steps' id=steps-bar style=width:0%></div></div><div class=label>Добавить шаги</div><div class=form-row><input type=number class=input id=steps-input placeholder='Количество шагов'><button class='btn btn-primary' onclick=addSteps()>+</button></div><div class=label style=margin-top:12px>Расстояние: <span id=steps-km>0</span> км | Ккал: <span id=steps-burned>0</span></div></div><div><div class=label>История за неделю</div><div class=chart-container><div class=chart-bar id=steps-chart></div></div></div></div></div></div><div class=section id=section-meals><div class=card><div class=card-title><span class=dot style=background:var(--accent4)></span>Дневник питания</div><div class=grid-2 style=margin-bottom:16px><div class=stat-card><div class='stat-value cals' id=meals-total>0</div><div class=stat-label>Ккал сегодня</div><div class='stat-goal'>Цель: <span id=meals-goal>2200</span></div></div><div class=stat-card><div class='stat-value' style=color:var(--accent2) id=meals-protein>0</div><div class=stat-label>Белки, г</div></div></div><div class=progress-bar style=margin-bottom:20px><div class='progress-fill cals' id=meals-bar style=width:0%></div></div><div class=label>Добавить приём пищи</div><div class=form-row><select class=input id=meal-type style=flex:1><option value=breakfast>Завтрак</option><option value=lunch>Обед</option><option value=dinner>Ужин</option><option value=snack>Перекус</option></select><input type=number class=input id=meal-cals placeholder=Ккал style=flex:1><input type=number class=input id=meal-protein placeholder='Белки, г' style=flex:1></div><input type=text class=input id=meal-desc placeholder='Что ели? Например: яйца, овощи, орехи' style=margin-bottom:12px><button class='btn btn-primary' onclick=addMeal()>Добавить</button><div style=margin-top:24px><div class=label>Сегодняшние приёмы</div><div id=meals-list></div></div></div></div><div class=section id=section-workouts><div class=card><div class=card-title><span class=dot style=background:var(--accent)></span>Тренировки</div><div class=workout-type><button class='workout-type-btn active' data-type=cardio onclick=selectWorkoutType('cardio')>Кардио</button><button class='workout-type-btn' data-type=strength onclick=selectWorkoutType('strength')>Силовая</button><button class='workout-type-btn' data-type=stretch onclick=selectWorkoutType('stretch')>Растяжка</button><button class='workout-type-btn' data-type=kite onclick=selectWorkoutType('kite')>Кайт</button><button class='workout-type-btn' data-type=walk onclick=selectWorkoutType('walk')>Ходьба</button></div><div class=grid-2><div><div class=label>Длительность, мин</div><input type=number class=input id=workout-duration placeholder=30 style=margin-bottom:12px><div class=label>Интенсивность</div><select class=input id=workout-intensity style=margin-bottom:12px><option value=low>Низкая</option><option value=medium selected>Средняя</option><option value=high>Высокая</option></select><div class=label>Заметки</div><textarea id=workout-notes placeholder='Как прошла тренировка?' style=margin-bottom:12px></textarea><button class='btn btn-primary' onclick=addWorkout()>Записать</button></div><div><div class=label>История тренировок</div><div id=workouts-list></div></div></div></div></div><div class=section id=section-reminders><div class=card><div class=card-title><span class=dot style=background:var(--accent)></span>Напоминания</div><div class=grid-2 style=margin-bottom:16px><div><div class=label>Время</div><input type=time class=input id=reminder-time style=margin-bottom:12px><div class=label>Текст напоминания</div><input type=text class=input id=reminder-text placeholder='Например: Выпить воды' style=margin-bottom:12px><div class=label>Повтор</div><select class=input id=reminder-repeat style=margin-bottom:12px><option value=once>Один раз</option><option value=daily>Ежедневно</option><option value=weekly>Еженедельно</option></select><button class='btn btn-primary' onclick=addReminder()>Добавить</button></div><div><div class=label>Активные напоминания</div><div id=reminders-list></div></div></div></div></div><div class=section id=section-profile><div class=card><div class=card-title><span class=dot style=background:var(--accent2)></span>Настройки и цели</div><div class=grid-2><div><div class=label>Имя</div><input type=text class=input id=prof-name value=Андрей style=margin-bottom:12px><div class=label>Возраст</div><input type=number class=input id=prof-age value=48 style=margin-bottom:12px><div class=label>Вес, кг</div><input type=number class=input id=prof-weight placeholder=75 style=margin-bottom:12px><div class=label>Рост, см</div><input type=number class=input id=prof-height placeholder=180 style=margin-bottom:12px><button class='btn btn-primary' onclick=saveProfile()>Сохранить профиль</button></div><div><div class=label>Цель по воде, мл</div><input type=number class=input id=goal-water value=2500 style=margin-bottom:12px><div class=label>Цель по сну, ч</div><input type=number class=input id=goal-sleep value=7.5 step=0.5 style=margin-bottom:12px><div class=label>Цель по шагам</div><input type=number class=input id=goal-steps value=10000 style=margin-bottom:12px><div class=label>Цель по калориям</div><input type=number class=input id=goal-cals value=2200 style=margin-bottom:12px><div class=label>Цель по белкам, г</div><input type=number class=input id=goal-protein value=120 style=margin-bottom:12px><button class='btn btn-primary' onclick=saveGoals()>Сохранить цели</button></div></div></div><div class=card style=margin-top:16px><div class=card-title><span class=dot style=background:var(--accent3)></span>О приложении</div><p style=color:var(--text2);font-size:14px;line-height:1.7>Health Assistant — ваш персональный трекер здоровья. Все данные сохраняются локально в браузере. Для сброса данных используйте кнопку ниже.</p><button class='btn btn-danger btn-sm' onclick=resetAll() style=margin-top:12px>🗑 Сбросить все данные</button></div></div></main></div><div class=modal id=modal><div class=modal-content><div class=modal-title id=modal-title></div><div id=modal-body></div><div class=modal-actions><button class='btn btn-secondary' onclick=closeModal()>Отмена</button><button class='btn btn-primary' id=modal-confirm>OK</button></div></div></div><script>(function(){const LS={get:k=>{try{return JSON.parse(localStorage.getItem('ht_'+k)||'null')}catch{return null}},set:(k,v)=>localStorage.setItem('ht_'+k,JSON.stringify(v))};const today=()=>new Date().toISOString().split('T')[0];const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().split('T')[0]};const fmtTime=t=>t?t.slice(0,5):'';const quotes=[['Здоровье — это не всё, но без здоровья всё — ничто.','Артур Шопенгауэр'],['Движение — это жизнь.','Гиппократ'],['Тот, кто не находит время для здоровья, потом найдёт время для болезни.','Эрл Найтингейл'],['Победа над собой — самая великая победа.','Платон'],['Сила не от тяжёлой работы, а от регулярной.','Брюс Ли']];let data=LS.get('data')||{water:{},sleep:{},steps:{},meals:{},workouts:{},reminders:[],profile:{name:'Андрей',age:48,weight:'',height:''},goals:{water:2500,sleep:7.5,steps:10000,cals:2200,protein:120}};let currentWorkoutType='cardio';function init(){document.getElementById('current-date').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});const q=quotes[Math.floor(Math.random()*quotes.length)];document.getElementById('daily-quote').innerHTML='<div>«'+q[0]+'»</div><div class=quote-author>— '+q[1]+'</div>';loadProfile();loadGoals();updateAll();setInterval(checkReminders,30000);checkReminders()}function save(){LS.set('data',data)}function showSection(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));const sec=document.getElementById('section-'+id);if(sec)sec.classList.add('active');const nav=document.querySelector('.nav-item[data-section='+id+']');if(nav)nav.classList.add('active');const titles={dashboard:'Дашборд',water:'Вода',sleep:'Сон',steps:'Шаги',meals:'Питание',workouts:'Тренировки',reminders:'Напоминания',profile:'Профиль'};document.getElementById('page-title').textContent=titles[id]||id;updateAll()}function updateAll(){renderDashboard();renderWater();renderSleep();renderSteps();renderMeals();renderWorkouts();renderReminders();renderProfile()}function getToday(key){const t=today();return data[key][t]||0}function getWeekData(key){const arr=[];for(let i=6;i>=0;i--){const d=daysAgo(i);arr.push({date:d,value:data[key][d]||0})}return arr}function pct(v,g){return Math.min(100,Math.round((v/g)*100))}function renderDashboard(){const w=getToday('water'),s=data.sleep[today()]||0,st=getToday('steps');let cals=0;(data.meals[today()]||[]).forEach(m=>cals+=m.cals||0);document.getElementById('dash-water').textContent=w;document.getElementById('dash-sleep').textContent=s;document.getElementById('dash-steps').textContent=st;document.getElementById('dash-cals').textContent=cals;document.getElementById('dash-water-bar').style.width=pct(w,data.goals.water)+'%';document.getElementById('dash-sleep-bar').style.width=pct(s,data.goals.sleep)+'%';document.getElementById('dash-steps-bar').style.width=pct(st,data.goals.steps)+'%';document.getElementById('dash-cals-bar').style.width=pct(cals,data.goals.cals)+'%';const meals=data.meals[today()]||[];const ml=document.getElementById('dash-meals-list');if(meals.length){ml.innerHTML=meals.map(m=>`<div class=list-item><div class=list-left><div class=list-icon>${m.type==='breakfast'?'🌅':m.type==='lunch'?'🍲':m.type==='dinner'?'🌙':'🍎'}</div><div><div class=list-title>${m.desc||m.type}</div><div class=list-desc>${m.cals} ккал · ${m.protein}г белка</div></div></div><div class=list-right><div class=list-value>${m.cals}</div></div></div>`).join('')}else{ml.innerHTML='<div class=empty-state><div class=empty-state-icon>🍽️</div>Нет записей о питании</div>'}const rem=data.reminders.filter(r=>!r.done).slice(0,3);const rl=document.getElementById('dash-reminders-list');if(rem.length){rl.innerHTML=rem.map(r=>`<div class='reminder-item ${isOverdue(r.time)?'overdue':''}'><div class='reminder-time ${isOverdue(r.time)?'overdue':''}'>${fmtTime(r.time)}</div><div class=reminder-text>${r.text}</div></div>`).join('')}else{rl.innerHTML='<div class=empty-state><div class=empty-state-icon>⏰</div>Нет напоминаний</div>'}renderWeeklyChart()}function renderWeeklyChart(){const steps=getWeekData('steps');const cont=document.getElementById('weekly-chart');if(!cont)return;const max=Math.max(...steps.map(d=>d.value),1);cont.innerHTML=steps.map((d,i)=>{const h=Math.round((d.value/max)*100);const day=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][new Date(d.date).getDay()];return`<div class=chart-col style=height:${h}%><div class=chart-col-value>${d.value>0?Math.round(d.value/1000)+'k':''}</div><div class=chart-col-label>${day}</div></div>`}).join('')}function renderWater(){const w=getToday('water');document.getElementById('water-total').textContent=w;document.getElementById('water-goal').textContent=data.goals.water;document.getElementById('water-bar').style.width=pct(w,data.goals.water)+'%';const hist=data.water[today()+'_log']||[];const h=document.getElementById('water-history');if(h){h.innerHTML=hist.length?hist.map((l,i)=>`<div class=list-item><div class=list-left><div class=list-icon>💧</div><div><div class=list-title>+${l} мл</div></div></div><button class='btn btn-sm btn-danger' onclick='removeWater(${i})'>×</button></div>`).join(''):'<div class=empty-state style=padding:20px>Нет записей</div>'}}function addWater(ml){const t=today();data.water[t]=(data.water[t]||0)+ml;data.water[t+'_log']=data.water[t+'_log']||[];data.water[t+'_log'].push(ml);save();renderWater();renderDashboard()}function removeWater(idx){const t=today();const log=data.water[t+'_log']||[];if(log[idx]){data.water[t]-=log[idx];data.water[t+'_log'].splice(idx,1);if(data.water[t]<0)data.water[t]=0;save();renderWater();renderDashboard()}}function renderSleep(){const s=data.sleep[today()]||0;document.getElementById('sleep-total').textContent=s;document.getElementById('sleep-goal').textContent=data.goals.sleep;document.getElementById('sleep-bar').style.width=pct(s,data.goals.sleep)+'%';const hist=[];for(let i=6;i>=0;i--){const d=daysAgo(i);if(data.sleep[d])hist.push({date:d,val:data.sleep[d]})}const h=document.getElementById('sleep-history');if(h){h.innerHTML=hist.length?hist.map(x=>`<div class=list-item><div class=list-left><div class=list-icon>🌙</div><div><div class=list-title>${new Date(x.date).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric'})}</div></div></div><div class=list-right><div class=list-value>${x.val} ч</div></div></div>`).join(''):'<div class=empty-state style=padding:20px>Нет записей</div>'}}function saveSleep(){const start=document.getElementById('sleep-start').value;const end=document.getElementById('sleep-end').value;if(!start||!end){alert('Укажите время отбоя и подъёма');return}let sh=parseInt(start.slice(0,2)),sm=parseInt(start.slice(3,5));let eh=parseInt(end.slice(0,2)),em=parseInt(end.slice(3,5));let dur=(eh*60+em)-(sh*60+sm);if(dur<0)dur+=24*60;const hours=(dur/60).toFixed(1);data.sleep[today()]=parseFloat(hours);save();renderSleep();renderDashboard();alert('Сон сохранён: '+hours+' ч')}function renderSteps(){const s=getToday('steps');document.getElementById('steps-total').textContent=s;document.getElementById('steps-goal').textContent=data.goals.steps;document.getElementById('steps-bar').style.width=pct(s,data.goals.steps)+'%';document.getElementById('steps-km').textContent=(s*0.0007).toFixed(2);document.getElementById('steps-burned').textContent=Math.round(s*0.04);const week=getWeekData('steps');const cont=document.getElementById('steps-chart');if(cont){const max=Math.max(...week.map(d=>d.value),1);cont.innerHTML=week.map(d=>{const h=Math.round((d.value/max)*100);const day=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][new Date(d.date).getDay()];return`<div class=chart-col style=height:${h}%><div class=chart-col-value>${d.value>0?Math.round(d.value/1000)+'k':''}</div><div class=chart-col-label>${day}</div></div>`}).join('')}}function addSteps(){const input=document.getElementById('steps-input');const v=parseInt(input.value)||0;if(v<=0)return;data.steps[today()]=(data.steps[today()]||0)+v;input.value='';save();renderSteps();renderDashboard()}function renderMeals(){const meals=data.meals[today()]||[];let totalCals=0,totalProt=0;meals.forEach(m=>{totalCals+=m.cals||0;totalProt+=m.protein||0});document.getElementById('meals-total').textContent=totalCals;document.getElementById('meals-protein').textContent=totalProt;document.getElementById('meals-goal').textContent=data.goals.cals;document.getElementById('meals-bar').style.width=pct(totalCals,data.goals.cals)+'%';const list=document.getElementById('meals-list');if(list){list.innerHTML=meals.length?meals.map((m,i)=>`<div class=meal-card><div class=meal-header><div class=meal-name>${m.type==='breakfast'?'🌅 Завтрак':m.type==='lunch'?'🍲 Обед':m.type==='dinner'?'🌙 Ужин':'🍎 Перекус'}</div><div class=meal-cals>${m.cals} ккал</div></div><div class=meal-list>${m.desc||''} · Белки: ${m.protein||0}г</div><button class='btn btn-sm btn-danger' onclick='removeMeal(${i})' style=margin-top:8px>Удалить</button></div>`).join(''):'<div class=empty-state>Нет записей о питании</div>'}}function addMeal(){const type=document.getElementById('meal-type').value;const cals=parseInt(document.getElementById('meal-cals').value)||0;const protein=parseInt(document.getElementById('meal-protein').value)||0;const desc=document.getElementById('meal-desc').value.trim();if(cals<=0){alert('Укажите калории');return}data.meals[today()]=data.meals[today()]||[];data.meals[today()].push({type,cals,protein,desc,time:new Date().toISOString()});document.getElementById('meal-cals').value='';document.getElementById('meal-protein').value='';document.getElementById('meal-desc').value='';save();renderMeals();renderDashboard()}function removeMeal(idx){data.meals[today()].splice(idx,1);save();renderMeals();renderDashboard()}function selectWorkoutType(type){currentWorkoutType=type;document.querySelectorAll('.workout-type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===type))}function renderWorkouts(){const list=data.workouts[today()]||[];const cont=document.getElementById('workouts-list');if(!cont)return;cont.innerHTML=list.length?list.map((w,i)=>`<div class=list-item><div class=list-left><div class=list-icon>${w.type==='cardio'?'🏃':w.type==='strength'?'💪':w.type==='stretch'?'🧘':w.type==='kite'?'🪁':'🚶'}</div><div><div class=list-title>${w.type==='cardio'?'Кардио':w.type==='strength'?'Силовая':w.type==='stretch'?'Растяжка':w.type==='kite'?'Кайт':'Ходьба'}</div><div class=list-desc>${w.duration} мин · ${w.intensity==='low'?'Низкая':w.intensity==='high'?'Высокая':'Средняя'}</div></div></div><button class='btn btn-sm btn-danger' onclick='removeWorkout(${i})'>×</button></div>`).join(''):'<div class=empty-state style=padding:20px>Нет тренировок</div>'}function addWorkout(){const dur=parseInt(document.getElementById('workout-duration').value)||0;const intensity=document.getElementById('workout-intensity').value;const notes=document.getElementById('workout-notes').value.trim();if(dur<=0){alert('Укажите длительность');return}data.workouts[today()]=data.workouts[today()]||[];data.workouts[today()].push({type:currentWorkoutType,duration:dur,intensity,notes,time:new Date().toISOString()});document.getElementById('workout-duration').value='';document.getElementById('workout-notes').value='';save();renderWorkouts();renderDashboard()}function removeWorkout(idx){data.workouts[today()].splice(idx,1);save();renderWorkouts();renderDashboard()}function renderReminders(){const list=document.getElementById('reminders-list');if(!list)return;const now=new Date();const curH=now.getHours();const curM=now.getMinutes();list.innerHTML=data.reminders.length?data.reminders.map((r,i)=>`<div class='reminder-item ${r.done?'done':isOverdue(r.time)?'overdue':''}'><div class='reminder-time ${isOverdue(r.time)?'overdue':''}'>${fmtTime(r.time)}</div><div class=reminder-text>${r.text}${r.repeat!=='once'?' ('+r.repeat+')':''}</div><button class=reminder-delete onclick='toggleReminder(${i})'>${r.done?'↩':'✓'}</button><button class=reminder-delete onclick='deleteReminder(${i})'>×</button></div>`).join(''):'<div class=empty-state>Нет напоминаний</div>';document.getElementById('reminder-badge').textContent=data.reminders.filter(r=>!r.done).length}function isOverdue(time){if(!time)return false;const now=new Date();const[h,m]=time.split(':').map(Number);return h<now.getHours()||(h===now.getHours()&&m<now.getMinutes())}function addReminder(){const time=document.getElementById('reminder-time').value;const text=document.getElementById('reminder-text').value.trim();const repeat=document.getElementById('reminder-repeat').value;if(!time||!text){alert('Заполните время и текст');return}data.reminders.push({time,text,repeat,done:false,id:Date.now()});document.getElementById('reminder-time').value='';document.getElementById('reminder-text').value='';save();renderReminders();renderDashboard()}function toggleReminder(idx){data.reminders[idx].done=!data.reminders[idx].done;save();renderReminders();renderDashboard()}function deleteReminder(idx){data.reminders.splice(idx,1);save();renderReminders();renderDashboard()}function checkReminders(){const now=new Date();const h=String(now.getHours()).padStart(2,'0');const m=String(now.getMinutes()).padStart(2,'0');const cur=`${h}:${m}`;data.reminders.forEach(r=>{if(!r.done&&r.time===cur){if('Notification'in window&&Notification.permission==='granted'){new Notification('Health Assistant',{body:r.text,icon:'💚'})}else{console.log('Напоминание:',r.text)}}})}function loadProfile(){if(data.profile){document.getElementById('prof-name').value=data.profile.name||'';document.getElementById('prof-age').value=data.profile.age||'';document.getElementById('prof-weight').value=data.profile.weight||'';document.getElementById('prof-height').value=data.profile.height||''}}function saveProfile(){data.profile={name:document.getElementById('prof-name').value,age:parseInt(document.getElementById('prof-age').value)||0,weight:document.getElementById('prof-weight').value,height:document.getElementById('prof-height').value};save();alert('Профиль сохранён')}function loadGoals(){if(data.goals){document.getElementById('goal-water').value=data.goals.water;document.getElementById('goal-sleep').value=data.goals.sleep;document.getElementById('goal-steps').value=data.goals.steps;document.getElementById('goal-cals').value=data.goals.cals;document.getElementById('goal-protein').value=data.goals.protein}}function saveGoals(){data.goals={water:parseInt(document.getElementById('goal-water').value)||2500,sleep:parseFloat(document.getElementById('goal-sleep').value)||7.5,steps:parseInt(document.getElementById('goal-steps').value)||10000,cals:parseInt(document.getElementById('goal-cals').value)||2200,protein:parseInt(document.getElementById('goal-protein').value)||120};save();updateAll();alert('Цели сохранены')}function renderProfile(){}function resetAll(){if(confirm('Все данные будут удалены. Продолжить?')){data={water:{},sleep:{},steps:{},meals:{},workouts:{},reminders:[],profile:{name:'Андрей',age:48,weight:'',height:''},goals:{water:2500,sleep:7.5,steps:10000,cals:2200,protein:120}};save();updateAll();alert('Данные сброшены')}}function showModal(title,body,onConfirm){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal').classList.add('show');document.getElementById('modal-confirm').onclick=()=>{closeModal();if(onConfirm)onConfirm()}}function closeModal(){document.getElementById('modal').classList.remove('show')}if('Notification'in window){Notification.requestPermission()}window.showSection=showSection;window.addWater=addWater;window.removeWater=removeWater;window.saveSleep=saveSleep;window.addSteps=addSteps;window.addMeal=addMeal;window.removeMeal=removeMeal;window.selectWorkoutType=selectWorkoutType;window.addWorkout=addWorkout;window.removeWorkout=removeWorkout;window.addReminder=addReminder;window.toggleReminder=toggleReminder;window.deleteReminder=deleteReminder;window.saveProfile=saveProfile;window.saveGoals=saveGoals;window.resetAll=resetAll;window.closeModal=closeModal;init()})();</script></body></html>
