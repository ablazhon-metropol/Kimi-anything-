<!DOCTYPE html><html lang=ru><head><meta charset=UTF-8><meta name=viewport content=width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no><title>Health Assistant</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}body{background:#0f0f0f;color:#f0f0f0;min-height:100vh}.app{max-width:480px;margin:0 auto;padding:16px;padding-bottom:80px}.header{text-align:center;padding:20px 0}.header h1{font-size:24px;font-weight:600}.header p{color:#888;font-size:14px;margin-top:4px}.card{background:#1a1a1a;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #333}.card-title{font-size:16px;font-weight:600;margin-bottom:12px;color:#4ade80}.stat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.stat-label{color:#aaa;font-size:14px}.stat-value{font-size:24px;font-weight:700}.stat-value.water{color:#60a5fa}.stat-value.sleep{color:#fbbf24}.stat-value.steps{color:#4ade80}.stat-value.cals{color:#f87171}.progress{height:8px;background:#333;border-radius:4px;overflow:hidden;margin-top:8px}.progress-bar{height:100%;border-radius:4px;transition:width .3s}.progress-bar.water{background:#60a5fa}.progress-bar.sleep{background:#fbbf24}.progress-bar.steps{background:#4ade80}.progress-bar.cals{background:#f87171}.btn{display:inline-block;padding:10px 16px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer;margin-top:8px;margin-right:8px}.btn-green{background:#4ade80;color:#000}.btn-blue{background:#60a5fa;color:#000}.btn-yellow{background:#fbbf24;color:#000}.btn-red{background:#f87171;color:#fff}.btn-gray{background:#333;color:#f0f0f0}.input{width:100%;padding:10px 12px;background:#222;border:1px solid #444;border-radius:8px;color:#f0f0f0;font-size:14px;margin-bottom:8px}.input:focus{outline:none;border-color:#4ade80}.label{display:block;color:#aaa;font-size:13px;margin-bottom:4px;margin-top:12px}.section-title{font-size:18px;font-weight:600;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid #333}.nav{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-top:1px solid #333;display:flex;justify-content:space-around;padding:8px 0;z-index:100}.nav-btn{background:none;border:none;color:#888;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 8px}.nav-btn.active{color:#4ade80}.nav-icon{font-size:20px}.hidden{display:none}.list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #333;font-size:14px}.list-item:last-child{border-bottom:none}.empty{text-align:center;color:#666;padding:20px;font-size:14px}.quick-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{display:inline-block;padding:6px 12px;background:#222;border:1px solid #444;border-radius:20px;font-size:13px;color:#aaa;cursor:pointer;margin:4px 4px 0 0}.chip.active{background:#4ade80;color:#000;border-color:#4ade80}.checkbox{width:20px;height:20px;border:2px solid #444;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#000}.checkbox.checked{background:#4ade80;border-color:#4ade80}.reminder-item{display:flex;align-items:center;gap:12px;padding:10px;background:#222;border-radius:8px;margin-bottom:8px}.reminder-time{min-width:50px;font-weight:600;color:#4ade80;font-size:13px}.reminder-text{flex:1;font-size:14px}.reminder-done{opacity:.4;text-decoration:line-through}.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}.tab-btn{padding:8px 14px;background:#222;border:1px solid #444;border-radius:20px;color:#aaa;font-size:13px;cursor:pointer;white-space:nowrap}.tab-btn.active{background:#4ade80;color:#000;border-color:#4ade80}.chart{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:12px}.chart-bar{flex:1;background:#333;border-radius:4px 4px 0 0;min-width:24px;position:relative}.chart-bar-fill{background:#4ade80;border-radius:4px 4px 0 0;position:absolute;bottom:0;left:0;right:0}.chart-label{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:#888;white-space:nowrap}.quote{background:#222;border-left:3px solid #4ade80;padding:12px;margin-bottom:16px;font-style:italic;color:#aaa;font-size:14px}.quote-author{color:#666;font-size:12px;margin-top:4px;font-style:normal}</style></head><body><div class=app><div class=header><h1>Health Assistant</h1><p>Андрей, 48 | Минск</p></div><div class=quote id=quote><div>Здоровье — это не всё, но без здоровья всё — ничто.</div><div class=quote-author>— Артур Шопенгауэр</div></div><div id=content></div></div><div class=nav><button class='nav-btn active' onclick=showPage('dashboard')><span class=nav-icon>📊</span><span>Главная</span></button><button class=nav-btn onclick=showPage('water')><span class=nav-icon>💧</span><span>Вода</span></button><button class=nav-btn onclick=showPage('sleep')><span class=nav-icon>🌙</span><span>Сон</span></button><button class=nav-btn onclick=showPage('steps')><span class=nav-icon>👟</span><span>Шаги</span></button><button class=nav-btn onclick=showPage('meals')><span class=nav-icon>🍽️</span><span>Еда</span></button><button class=nav-btn onclick=showPage('workouts')><span class=nav-icon>💪</span><span>Спорт</span></button><button class=nav-btn onclick=showPage('reminders')><span class=nav-icon>⏰</span><span>Напом.</span></button></div><script>(function(){const LS={get:k=>{try{const v=localStorage.getItem('ha_'+k);return v?JSON.parse(v):null}catch(e){return null}},set:(k,v)=>localStorage.setItem('ha_'+k,JSON.stringify(v))};const today=()=>new Date().toISOString().split('T')[0];const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().split('T')[0]};const quotes=[['Здоровье — это не всё, но без здоровья всё — ничто.','Артур Шопенгауэр'],['Движение — это жизнь.','Гиппократ'],['Тот, кто не находит время для здоровья, потом найдёт время для болезни.','Эрл Найтингейл'],['Победа над собой — самая великая победа.','Платон']];let data=LS.get('data')||{water:{},sleep:{},steps:{},meals:{},workouts:{},reminders:[],goals:{water:2500,sleep:7.5,steps:10000,cals:2200,protein:120}};let page='dashboard';function init(){const q=quotes[Math.floor(Math.random()*quotes.length)];document.getElementById('quote').innerHTML='<div>'+q[0]+'</div><div class=quote-author>— '+q[1]+'</div>';render();setInterval(checkReminders,30000)}function save(){LS.set('data',data)}function showPage(p){page=p;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));event.target.closest('.nav-btn').classList.add('active');render()}function getToday(k){return data[k][today()]||0}function pct(v,g){return Math.min(100,Math.round((v/g)*100))}function render(){const c=document.getElementById('content');if(page==='dashboard')renderDashboard(c);else if(page==='water')renderWater(c);else if(page==='sleep')renderSleep(c);else if(page==='steps')renderSteps(c);else if(page==='meals')renderMeals(c);else if(page==='workouts')renderWorkouts(c);else if(page==='reminders')renderReminders(c)}function renderDashboard(c){const w=getToday('water'),s=data.sleep[today()]||0,st=getToday('steps');let cal=0;(data.meals[today()]||[]).forEach(m=>cal+=m.cals||0);const rem=data.reminders.filter(r=>!r.done).length;c.innerHTML='<div class=card><div class=card-title>📊 Сегодня</div><div class=stat-row><span class=stat-label>Вода</span><span class=stat-value water>'+w+' <small style=font-size:14px;color:#888>/ '+data.goals.water+' мл</small></span></div><div class=progress><div class=progress-bar water style=width:'+pct(w,data.goals.water)+'%></div></div><div class=stat-row style=margin-top:12px><span class=stat-label>Сон</span><span class=stat-value sleep>'+s+' <small style=font-size:14px;color:#888>/ '+data.goals.sleep+' ч</small></span></div><div class=progress><div class=progress-bar sleep style=width:'+pct(s,data.goals.sleep)+'%></div></div><div class=stat-row style=margin-top:12px><span class=stat-label>Шаги</span><span class=stat-value steps>'+st+' <small style=font-size:14px;color:#888>/ '+data.goals.steps+'</small></span></div><div class=progress><div class=progress-bar steps style=width:'+pct(st,data.goals.steps)+'%></div></div><div class=stat-row style=margin-top:12px><span class=stat-label>Ккал</span><span class=stat-value cals>'+cal+' <small style=font-size:14px;color:#888>/ '+data.goals.cals+'</small></span></div><div class=progress><div class=progress-bar cals style=width:'+pct(cal,data.goals.cals)+'%></div></div></div><div class=card><div class=card-title>⏰ Активные напоминания: '+rem+'</div>'+(rem?data.reminders.filter(r=>!r.done).slice(0,3).map(r=>'<div class=list-item><span>'+r.time+'</span><span>'+r.text+'</span></div>').join(''):'<div class=empty>Нет напоминаний</div>')+'</div><div class=card><div class=card-title>📈 Шаги за неделю</div><div class=chart>'+getWeekData('steps').map(d=>'<div class=chart-bar style=height:120px><div class=chart-bar-fill style=height:'+Math.round((d.value/Math.max(...getWeekData(0).map(x=>x.value),1))*100)+'%></div><div class=chart-label>'+['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][new Date(d.date).getDay()]+'</div></div>').join('')+'</div></div>'}function getWeekData(k){const arr=[];for(let i=6;i>=0;i--){const d=daysAgo(i);arr.push({date:d,value:k===0?0:(data[k]||{})[d]||0})}return arr}function renderWater(c){const w=getToday('water');c.innerHTML='<div class=card><div class=card-title>💧 Вода</div><div class=stat-row><span class=stat-label>Выпито</span><span class=stat-value water>'+w+' мл</span></div><div class=progress><div class=progress-bar water style=width:'+pct(w,data.goals.water)+'%></div></div><div class=quick-btns><button class=btn btn-blue onclick=addWater(250)>+250 мл</button><button class=btn btn-blue onclick=addWater(500)>+500 мл</button><button class=btn btn-blue onclick=addWater(750)>+750 мл</button></div></div><div class=card><div class=card-title>История сегодня</div>'+((data.water[today()+'_log']||[]).length?(data.water[today()+'_log']||[]).map((l,i)=>'<div class=list-item><span>+ '+l+' мл</span><button class=btn btn-gray style=padding:4px 8px;margin:0 onclick=removeWater('+i+')>Удалить</button></div>').join(''):'<div class=empty>Нет записей</div>')+'</div>'}function addWater(ml){data.water[today()]=(data.water[today()]||0)+ml;data.water[today()+'_log']=data.water[today()+'_log']||[];data.water[today()+'_log'].push(ml);save();render()}function removeWater(i){const log=data.water[today()+'_log']||[];if(log[i]){data.water[today()]-=log[i];data.water[today()+'_log'].splice(i,1);if(data.water[today()]<0)data.water[today()]=0;save();render()}}function renderSleep(c){const s=data.sleep[today()]||0;c.innerHTML='<div class=card><div class=card-title>🌙 Сон</div><div class=stat-row><span class=stat-label>Сегодня</span><span class=stat-value sleep>'+s+' ч</span></div><div class=progress><div class=progress-bar sleep style=width:'+pct(s,data.goals.sleep)+'%></div></div><div class=label>Время отбоя</div><input type=time class=input id=sleep-start><div class=label>Время подъёма</div><input type=time class=input id=sleep-end><div class=label>Качество</div><select class=input id=sleep-q><option value=0>Оцените</option><option value=5>😴 Плохой</option><option value=7>🙂 Нормальный</option><option value=9>😁 Отличный</option><option value=10>🤩 Идеальный</option></select><button class=btn btn-yellow onclick=saveSleep()>Сохранить</button></div><div class=card><div class=card-title>История (7 дней)</div>'+(Object.keys(data.sleep||{}).filter(k=>!k.includes('_log')).sort().slice(-7).map(d=>'<div class=list-item><span>'+new Date(d).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric'})+'</span><span>'+data.sleep[d]+' ч</span></div>').join('')||'<div class=empty>Нет записей</div>')+'</div>'}function saveSleep(){const st=document.getElementById('sleep-start').value,en=document.getElementById('sleep-end').value;if(!st||!en){alert('Укажите время');return}let sh=parseInt(st.slice(0,2)),sm=parseInt(st.slice(3,5)),eh=parseInt(en.slice(0,2)),em=parseInt(en.slice(3,5));let dur=(eh*60+em)-(sh*60+sm);if(dur<0)dur+=24*60;const h=(dur/60).toFixed(1);data.sleep[today()]=parseFloat(h);save();render()}function renderSteps(c){const s=getToday('steps');c.innerHTML='<div class=card><div class=card-title>👟 Шаги</div><div class=stat-row><span class=stat-label>Сегодня</span><span class=stat-value steps>'+s+'</span></div><div class=progress><div class=progress-bar steps style=width:'+pct(s,data.goals.steps)+'%></div></div><div style=color:#888;font-size:13px;margin-top:4px>≈ '+(s*0.0007).toFixed(2)+' км | ≈ '+Math.round(s*0.04)+' ккал</div><div class=label>Добавить шаги</div><input type=number class=input id=steps-input placeholder=Количество><button class=btn btn-green onclick=addSteps()>Добавить</button></div><div class=card><div class=card-title>Неделя</div><div class=chart>'+getWeekData('steps').map(d=>'<div class=chart-bar style=height:120px><div class=chart-bar-fill style=height:'+Math.round((d.value/Math.max(...getWeekData(0).map(x=>x.value),1))*100)+'%></div><div class=chart-label>'+['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][new Date(d.date).getDay()]+'</div></div>').join('')+'</div></div>'}function addSteps(){const v=parseInt(document.getElementById('steps-input').value)||0;if(v<=0)return;data.steps[today()]=(data.steps[today()]||0)+v;save();render()}function renderMeals(c){const meals=data.meals[today()]||[];let tc=0,tp=0;meals.forEach(m=>{tc+=m.cals||0;tp+=m.protein||0});c.innerHTML='<div class=card><div class=card-title>🍽️ Питание</div><div class=stat-row><span class=stat-label>Ккал</span><span class=stat-value cals>'+tc+' / '+data.goals.cals+'</span></div><div class=progress><div class=progress-bar cals style=width:'+pct(tc,data.goals.cals)+'%></div></div><div class=stat-row style=margin-top:8px><span class=stat-label>Белки</span><span class=stat-value>'+tp+' / '+data.goals.protein+' г</span></div></div><div class=card><div class=card-title>Добавить приём пищи</div><select class=input id=meal-type><option value=breakfast>Завтрак</option><option value=lunch>Обед</option><option value=dinner>Ужин</option><option value=snack>Перекус</option></select><input type=number class=input id=meal-cals placeholder=Калории><input type=number class=input id=meal-protein placeholder='Белки, г'><input type=text class=input id=meal-desc placeholder='Что ели?'><button class=btn btn-green onclick=addMeal()>Добавить</button></div><div class=card><div class=card-title>Сегодня</div>'+(meals.length?meals.map((m,i)=>'<div class=list-item><span>'+(m.type==='breakfast'?'🌅':m.type==='lunch'?'🍲':m.type==='dinner'?'🌙':'🍎')+' '+(m.desc||m.type)+'</span><span>'+m.cals+' ккал</span></div>').join(''):'<div class=empty>Нет записей</div>')+'</div>'}function addMeal(){const type=document.getElementById('meal-type').value,cals=parseInt(document.getElementById('meal-cals').value)||0,protein=parseInt(document.getElementById('meal-protein').value)||0,desc=document.getElementById('meal-desc').value.trim();if(cals<=0){alert('Укажите калории');return}data.meals[today()]=data.meals[today()]||[];data.meals[today()].push({type,cals,protein:protein||0,desc,time:new Date().toISOString()});save();render()}function renderWorkouts(c){const list=data.workouts[today()]||[];c.innerHTML='<div class=card><div class=card-title>💪 Тренировка</div><div class=quick-btns><span class=chip id=w-cardio onclick=selWorkout(0)>Кардио</span><span class=chip id=w-strength onclick=selWorkout(1)>Силовая</span><span class=chip id=w-stretch onclick=selWorkout(2)>Растяжка</span><span class=chip id=w-kite onclick=selWorkout(3)>Кайт</span><span class=chip id=w-walk onclick=selWorkout(4)>Ходьба</span></div><div class=label>Минут</div><input type=number class=input id=w-dur placeholder=30><div class=label>Интенсивность</div><select class=input id=w-int><option value=low>Низкая</option><option value=medium selected>Средняя</option><option value=high>Высокая</option></select><button class=btn btn-green onclick=addWorkout()>Записать</button></div><div class=card><div class=card-title>Сегодня</div>'+(list.length?list.map(w=>'<div class=list-item><span>'+(w.type==='cardio'?'🏃':w.type==='strength'?'💪':w.type==='stretch'?'🧘':w.type==='kite'?'🪁':'🚶')+' '+w.type+' ('+w.duration+' мин)</span><span>'+w.intensity+'</span></div>').join(''):'<div class=empty>Нет тренировок</div>')+'</div>';selWorkout(0)}let wType='cardio';function selWorkout(i){const types=['cardio','strength','stretch','kite','walk'];wType=types[i];document.querySelectorAll('.chip').forEach((c,idx)=>c.classList.toggle('active',idx===i))}function addWorkout(){const dur=parseInt(document.getElementById('w-dur').value)||0;if(dur<=0){alert('Укажите длительность');return}data.workouts[today()]=data.workouts[today()]||[];data.workouts[today()].push({type:wType,duration:dur,intensity:document.getElementById('w-int').value,time:new Date().toISOString()});save();render()}function renderReminders(c){c.innerHTML='<div class=card><div class=card-title>⏰ Напоминания</div><div class=label>Время</div><input type=time class=input id=r-time><div class=label>Текст</div><input type=text class=input id=r-text placeholder=Например: выпить воды><div class=label>Повтор</div><select class=input id=r-rep><option value=once>Один раз</option><option value=daily>Ежедневно</option></select><button class=btn btn-green onclick=addReminder()>Добавить</button></div><div class=card><div class=card-title>Активные</div>'+(data.reminders.filter(r=>!r.done).length?data.reminders.filter(r=>!r.done).map((r,i)=>'<div class=reminder-item><span class=reminder-time>'+r.time+'</span><span class=reminder-text>'+r.text+(r.repeat!==once?' (ежедневно)':'')+'</span><button class=btn btn-gray style=padding:4px 8px;margin:0 onclick=toggleReminder('+i+')>✓</button><button class=btn btn-red style=padding:4px 8px;margin:0 onclick=delReminder('+i+')>×</button></div>').join(''):'<div class=empty>Нет напоминаний</div>')+'</div>'}function addReminder(){const t=document.getElementById('r-time').value,txt=document.getElementById('r-text').value.trim(),rep=document.getElementById('r-rep').value;if(!t||!txt){alert('Заполните поля');return}data.reminders.push({time:t,text:txt,repeat:rep,done:false,id:Date.now()});save();render()}function toggleReminder(i){const r=data.reminders.filter(x=>!x.done)[i];if(r)r.done=true;save();render()}function delReminder(i){const idx=data.reminders.findIndex(x=>!x.done);if(idx>=0)data.reminders.splice(idx,1);save();render()}function checkReminders(){const now=new Date(),h=String(now.getHours()).padStart(2,'0'),m=String(now.getMinutes()).padStart(2,'0'),cur=h+':'+m;data.reminders.forEach(r=>{if(!r.done&&r.time===cur){if('Notification'in window&&Notification.permission==='granted')new Notification('Health Assistant',{body:r.text})}})}window.showPage=showPage;window.addWater=addWater;window.removeWater=removeWater;window.saveSleep=saveSleep;window.addSteps=addSteps;window.addMeal=addMeal;window.selWorkout=selWorkout;window.addWorkout=addWorkout;window.addReminder=addReminder;window.toggleReminder=toggleReminder;window.delReminder=delReminder;if('Notification'in window)Notification.requestPermission();init()})();</script></body></html>
